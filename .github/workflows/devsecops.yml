name: DevSecOps CI/CD Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  sast_semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Semgrep & Run Scan
        run: |
          python -m pip install semgrep
          semgrep scan --config auto --json -o semgrep-results.json || true

      - name: Upload SAST Artifact
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.json

  dast_zap:
    name: DAST (OWASP ZAP Baseline)
    runs-on: ubuntu-latest
    needs: sast_semgrep
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies & Run Target App
        run: |
          pip install flask
          python app.py &
          sleep 5

      - name: Run OWASP ZAP Container Scan
        run: |
          docker run --net=host -v $(pwd):/zap/wrk/:rw ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://localhost:5000/search?q=test -r zap-report.html || true

      - name: Upload DAST Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-report.html
